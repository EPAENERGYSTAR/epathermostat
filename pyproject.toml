[project]
name = "thermostat"
version = "1.7.7"
description = "Calculate connected thermostat savings"
requires-python = ">=3.8"
dynamic = ["readme", "license", "authors", "keywords", "classifiers", "dependencies", "optional-dependencies"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "mock==2.0.0",
    "setuptools",
]

