[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermostat"
description = "Calculate connected thermostat temperature/run-time savings"
readme = "README.md"
license = { file = "osi-mit--license.txt" }
authors = [{ name = "Phil Ngo" }]
keywords = ["thermostat", "savings", "EPA"]
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The redesigned eeweather (WeatherStation/WeatherLocation + load_data) is
    # not yet released as `eeweather` on PyPI -- 0.3.x there is the old API,
    # which this package cannot run against. eeweather-epa is a frozen,
    # unmodified snapshot of opendsm/eeweather master (5dd1959, 2026-10-13)
    # that installs the same `eeweather` import package. Pinned exactly, since
    # the snapshot is the build the golden corpus was verified against. Swap
    # for `eeweather` once opendsm releases the redesign.
    "eeweather-epa==2026.10.13",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "requests",
    "scipy>=1.11",
    "python-dateutil",
    "pytz",
]

[project.urls]
Homepage = "https://github.com/EPAENERGYSTAR/epathermostat"
Documentation = "https://epathermostat.readthedocs.io/"

[project.optional-dependencies]
docs = ["sphinx", "sphinx_rtd_theme"]
dev = ["pytest", "pytest-cov", "coverage", "tox", "pyflakes"]

[tool.setuptools.dynamic]
version = { attr = "thermostat._version.__version__" }

[tool.setuptools.packages.find]
include = ["thermostat*"]

[tool.setuptools.package-data]
"thermostat.resources" = ["*.csv"]
