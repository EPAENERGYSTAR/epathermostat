# RTD v2 config. The previous file set `python.version: 3.6`, a key the v2
# schema no longer supports, and requested an `extra_requirements: [docs]`
# that setup.py never defined -- so the build was broken by construction.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
