name: Python package

on:
  push:
  # Without this, pull requests -- including every fork PR -- were never tested.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # numpy/scipy/pandas/shapely/pyproj all publish cp314 wheels at the
        # versions pinned in requirements.txt, and the full suite passes on
        # 3.14, so the matrix spans 3.11-3.14 (setup.py's floor is 3.11).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
        cache: 'pip'

    - name: Verify Python
      run: |
        python --version
        pip --version

    - name: Install dependencies
      # requirements.txt pins the reshaped eeweather from its public upstream
      # feature branch (opendsm/eeweather@feature/power-source), so this installs
      # without any secret. No cache priming: the reshaped eeweather fetches on
      # demand, so the old ~/.eeweather sqlite prime step is gone.
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt
        pip install -r dev-requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      # The suite is offline. Every thermostat fixture used to call from_csv,
      # which fetched live weather from NOAA during collection -- so a NOAA
      # outage turned this job red for reasons unrelated to the code, and a
      # real regression in a regulated value looked exactly the same. The
      # weather the corpus needs is recorded in tests/data/weather_fixture.npz.xz
      # (see scripts/build_weather_fixture.py); EEWEATHER_AUTO_UPDATE=0 stops
      # eeweather refreshing its registry mid-run, which would make station
      # selection depend on the day the job happened to run.
      #
      # `-o addopts=""` drops the repo's default -x/--cov flags; coverage is
      # requested explicitly so it is actually collected.
      env:
        EEWEATHER_AUTO_UPDATE: "0"
      run: |
        python -m pytest tests/ -o addopts="" -v \
          --cov=thermostat --cov-report=term-missing --cov-report=xml
