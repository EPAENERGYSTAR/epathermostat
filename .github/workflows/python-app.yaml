name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # numpy/scipy/pandas/shapely/pyproj all publish cp314 wheels at the
        # versions pinned in requirements.txt, and the full suite passes on
        # 3.14, so the matrix spans 3.11-3.14 (setup.py's floor is 3.11).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
        cache: 'pip'

    - name: Verify Python
      run: |
        python --version
        pip --version

    - name: Install dependencies
      # requirements.txt pins the reshaped eeweather from its public upstream
      # feature branch (opendsm/eeweather@feature/power-source), so this installs
      # without any secret. No cache priming: the reshaped eeweather fetches on
      # demand, so the old ~/.eeweather sqlite prime step is gone.
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt
        pip install -r dev-requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      # This 1.8.0 preview migrates the weather layer to the reshaped eeweather
      # (a single GHCNh source; see thermostat/eeweather_wrapper.py and
      # thermostat/stations.py). The full regulated suite (test_metrics /
      # test_core / test_demand / ...) fetches live weather during from_csv from
      # NOAA's GHCNh access API, so this job hits the network on purpose. The
      # golden reference metrics were regenerated against GHCNh for 1.8.0.
      # `-o addopts=""` drops the repo's default --cov flags. Slow ZCTA-coverage
      # tests stay opt-in (no --runslow).
      run: |
        python -m pytest tests/ -o addopts="" -v
