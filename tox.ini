[tox]
envlist = clean,py{311,312,313,314},report

[pytest]
testpaths = tests
# -x (fail-fast) is deliberately absent: these addopts apply to every pytest
# invocation in the repo, and a regression suite is more useful reporting all
# failures than stopping at the first. CI no longer has to strip them.
addopts =
    --cov-report=term-missing --cov=thermostat --cov-append

[testenv]
deps =
    pytest
    pytest-cov
commands =
     pytest {posargs:-vv} 

depends =
    {py311,py312,py313,py314}: clean
    report: py311,py312,py313,py314

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage html
    coverage report

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[coverage:run]
parallel=True
data_suffix=True
